<style>
/* Layout: sabit sol menü + tarama odaklı iş alanı; mobilde üstte yatay menü. */

  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#EBEDF2; --ink:#151B2C; --muted:#5A6377; --line:#D9DDE6;

  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141D; --surface:#171D29; --sunk:#1E2533; --ink:#E7EAF1; --muted:#9AA3B6; --line:#2A3345;
  --primary:#8FB0F0; --primary-ink:#0F1726; --accent:#E2575D;
  --crit:#FF6B6B; --crit-bg:#3A1C20; --warn:#F2B04C; --warn-bg:#3A2C13; --ok:#5FCB8C; --ok-bg:#173022; --info:#86AEF0; --info-bg:#1A2740;
  --b-aer:#E66FA6; --b-tra:#62A8EE; --b-par:#D6B23E; --b-akr:#3FC2B0; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#10141D; --surface:#171D29; --sunk:#1E2533; --ink:#E7EAF1; --muted:#9AA3B6; --line:#2A3345;
  --primary:#8FB0F0; --primary-ink:#0F1726; --accent:#E2575D;
  --crit:#FF6B6B; --crit-bg:#3A1C20; --warn:#F2B04C; --warn-bg:#3A2C13; --ok:#5FCB8C; --ok-bg:#173022; --info:#86AEF0; --info-bg:#1A2740;
  --b-aer:#E66FA6; --b-tra:#62A8EE; --b-par:#D6B23E; --b-akr:#3FC2B0; color-scheme:dark;}
*{box-sizing:border-box}

.miss-chips{display:flex;flex-wrap:wrap;gap:4px}

@media (max-width:760px){.idit{grid-template-columns:minmax(0,1fr)} .idimg img{max-width:340px}

<body>
<div class="app">
  <nav class="side" id="nav" aria-label="Bölümler"></nav>
  <main id="main"><div class="banner" id="banner" hidden></div><div id="view"></div></main>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="supabase.js"></script>
<script>
// GYMOPS çalışma katmanı — veritabanı.
// Uygulamanın bugün claude.ai'den aldığı Firestore-benzeri API'yi (collection/doc/set/delete/onSnapshot)
// Supabase'teki tek tablo `docs(collection,id,data,version)` üzerinde sağlar.
// Her belgenin verisine okunurken `__v` (sürüm) eklenir; uygulama nesneyi bu alanla kaydederse, kayıt
// yalnız o sürüm hâlâ güncelse yazılır (formu eski açık kalan cihaz başkasının değişikliğini silemez).
(function (root) {
  'use strict';
  const PAGE = 1000;
  const err = (code, message) => Object.assign(new Error(message || code), { code });
  const netErr = e => (e && e.code === 'P0409' ? err('conflict', 'Bu kayıt başka bir cihazda değişti') : err('unavailable', (e && e.message) || 'Bağlantı yok'));

  function createDb(supabase, opts = {}) {
    const retryMs = opts.retryMs || 2000;
    const versions = new Map(); // "col|id" -> son görülen sürüm
    const refreshers = new Map(); // col -> Set(load) ; çakışmada anlık görüntüyü tazelemek için
    const locals = new Map(); // col -> Set({put,drop}) ; kendi yazmalarımızı yankı beklemeden göstermek için

    function collection(col) {
      let ord = null, lim = null;
      const q = {
        orderBy(field, dir) { ord = { field, desc: dir === 'desc' }; return q; },
        limit(n) { lim = n; return q; },
        where() { return q; },
        doc(id) { return docRef(col, id); },
        onSnapshot(cb, errCb) { return listen(col, ord, lim, cb, errCb); }
      };
      return q;
    }

    function docRef(col, id) {
      const k = col + '|' + id;
      return {
        async set(obj) {
          const data = JSON.parse(JSON.stringify(obj));
          const base = Number.isInteger(data.__v) ? data.__v : null;
          delete data.__v;
          const exp = base != null ? base : versions.has(k) ? versions.get(k) : null;
          let r;
          try { r = await supabase.rpc('docs_put', { p_col: col, p_id: id, p_data: data, p_expect: exp }); }
          catch (e) { throw netErr(e); }
          if (r.error) {
            if (r.error.code === 'P0409') (refreshers.get(col) || []).forEach(f => f());
            throw netErr(r.error);
          }
          versions.set(k, r.data);
          (locals.get(col) || []).forEach(l => l.put(id, data, r.data));
        },
        async delete() {
          let r;
          try { r = await supabase.from('docs').delete().eq('collection', col).eq('id', id); }
          catch (e) { throw netErr(e); }
          if (r.error) throw netErr(r.error);
          versions.delete(k);
          (locals.get(col) || []).forEach(l => l.drop(id));
        }
      };
    }

    function listen(col, ord, lim, cb, errCb) {
      const rows = new Map(); // id -> {data, version}
      let closed = false, down = false, wait = retryMs, timer = null;
      const fail = (e) => { if (!closed && errCb) { try { errCb(err('unavailable', (e && e.message) || 'Bağlantı yok')); } catch (x) {} } };
      const emit = () => {
        if (closed) return;
        let list = [...rows.entries()].map(([id, r]) => ({ id, data: r.data, v: r.version }));
        if (ord) {
          const f = ord.field;
          list.sort((a, b) => { const x = a.data[f], y = b.data[f]; return (x < y ? -1 : x > y ? 1 : 0) * (ord.desc ? -1 : 1); });
        }
        if (lim != null) list = list.slice(0, lim);
        cb({ docs: list.map(d => ({ id: d.id, data: () => Object.assign(JSON.parse(JSON.stringify(d.data)), { __v: d.v }) })), metadata: { fromCache: false } });
      };
      const keep = (id, data, version) => { rows.set(id, { data, version }); versions.set(col + '|' + id, version); };
      const fetchAll = async () => {
        if (lim != null) {
          let qy = supabase.from('docs').select('id,data,version').eq('collection', col);
          if (ord) qy = qy.order('data->>' + ord.field, { ascending: !ord.desc });
          const r = await qy.limit(Math.min(Math.max(lim * 2, lim + 50), PAGE));
          if (r.error) throw r.error; return r.data || [];
        }
        const all = [];
        for (let from = 0; ; from += PAGE) {
          const r = await supabase.from('docs').select('id,data,version').eq('collection', col).order('id', { ascending: true }).range(from, from + PAGE - 1);

function dbErr(e){const c=e&&e.code;
  if(c==='conflict')return 'Bu kayıt başka bir cihazda değişti; sayfa güncellendi, tekrar dene.';
  if(c==='invalid_argument'){return 'Kaydedilemedi: bu sayfada yazma yetkin yok ya da veri geçersiz.'}

  return (e&&e.message)||'Bilinmeyen hata';}

async function put(col,id,obj,msg){
  if(!db||readOnly)throw{code:'not_granted',message:'Veritabanı kullanılamıyor.'};
  const noSync=!!(obj&&obj._noSync);const prev=LINKC.includes(col)?((S[col]||[]).find(x=>x.id===id)||null):null;const prev0=prev&&JSON.parse(JSON.stringify(prev));

  let kaf=null;if(col==='entries'&&!obj._noKaf){try{kaf=kafEvent(id,obj)}catch(e){kaf=null}}
  const clean=JSON.parse(JSON.stringify(obj));delete clean.id;delete clean._noKaf;delete clean._noSync;if(noSync)delete clean.__v;clean.updatedAt=now(); // eşitleme yazmaları eski kopyadan gelebilir: sürüm, bu cihazın son yazdığından alınır
  let imp=null;try{imp=impactOf(col,id,clean)}catch(e){imp=null}
  if(imp&&imp.self&&!('recheckClear' in clean))clean.recheck=recheckMerge(S.orgs.find(x=>x.id===id)||{},imp.ch);delete clean.recheckClear;
  const ref=db.collection(col).doc(id);
  try{await ref.set(clean)}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));await ref.set(clean)}else throw e}
  if(imp&&!imp.self){const o=S.orgs.find(x=>x.id===imp.orgId);if(o){const d=Object.assign({},o,{recheck:recheckMerge(o,imp.ch),updatedAt:now()});delete d.id;try{await db.collection('orgs').doc(o.id).set(JSON.parse(JSON.stringify(d)))}catch(e){}}}
  if(msg)logIt(msg);
  if(kaf)kafApply(kaf).catch(()=>{});
  if(!noSync&&LINKC.includes(col)){try{await linkSync(col,id,clean,prev0)}catch(e){}}
}

function computeIssues(onlyOrg){
  const out=[];
  for(const o of S.orgs){
    if(onlyOrg&&o.id!==onlyOrg)continue;
    const doneOpen=o.status==='tamamlandi'&&partOf(o)==='katiliyor'&&!o.closedAt&&isDate(o.endDate||o.startDate)&&daysUntil(o.endDate||o.startDate)<0&&daysUntil(o.endDate||o.startDate)>=-365;
    if(doneOpen&&(onlyOrg||orgVisible(o))){const C=closeCheck(o);if(C.length){out.push({lvl:2,org:o,orgId:o.id,title:`“Tamamlandı” işaretli ama ${C.length} açık yükümlülük var`,rs:C.slice(0,3),date:o.endDate||o.startDate,n:daysUntil(o.endDate||o.startDate),tab:'ozet'});continue}}
    if(!onlyOrg&&(!isLive(o)||!orgVisible(o)))continue;
    if(partOf(o)==='katilmiyor')continue;
    if(partOf(o)==='karar_yok'){
      for(const d of S.deadlines.filter(d=>d.orgId===o.id&&d.status==='bekliyor'&&['provisional','definitive'].includes(d.kind))){
        const n=daysUntil(d.date);if(n===null||n<-3)continue;

        out.push({lvl,org:o,orgId:o.id,title:dlLabel(d)+(d.kind==='definitive'?' — katılım kararı':''),rs:[d.kind==='definitive'?'definitive yapılınca organizasyon operasyona geçer':'provisional yapılmazsa ceza / kayıt hakkı kaybı',d.source||''].filter(Boolean),date:d.date,n,tab:'sontarih'});
      }
      continue;
    }
    const st=orgStats(o);
    for(const d of S.deadlines.filter(d=>d.orgId===o.id&&d.status==='bekliyor')){
      const n=daysUntil(d.date);if(n===null)continue;
      let lvl=n<0?0:n<=3?1:n<=10?2:n<=30?3:null;const rs=[];
      const bump=()=>{if(lvl!==null&&lvl>1)lvl-=1};
      if(['nominative','definitive'].includes(d.kind)){if(!st.ents.length){rs.push('kafileye henüz kimse eklenmedi');bump()}else if(st.aday){rs.push(`${st.aday} kişi hâlâ aday`);bump()}}

      if(['ucus','transfer'].includes(d.kind)&&st.noFlight){rs.push(`${st.noFlight} kişinin uçuş bilgisi eksik`);bump()}
      if(d.kind==='konaklama'&&st.noRoom){rs.push(`${st.noRoom} kişinin oda ataması yok`);bump()}
      if(['otel_odeme','katilim_ucreti'].includes(d.kind)&&st.unpaid.length)rs.push(`${st.unpaid.length} bekleyen ödeme`);
      if(d.sourceType==='dogrulanmamis')rs.push('tarih doğrulanmamış');
      if(d.history&&d.history.length)rs.push(`tarih değişti (önceki: ${fmtS(d.history[d.history.length-1].from)})`);
      if(lvl===null)continue;
      out.push({lvl,org:o,orgId:o.id,title:dlLabel(d),date:d.date,n,rs,tab:'sontarih'});
    }
    for(const c of S.checklist.filter(c=>c.orgId===o.id&&!c.done)){
      const n=daysUntil(c.due);if(n===null)continue;const lvl=n<0?0:n<=3?1:n<=7?2:null;if(lvl===null)continue;
      const dr=c.doc&&TRDOCS[c.doc]?TRDOCS[c.doc].b(o):null;
      out.push({lvl,org:o,orgId:o.id,title:'Checklist: '+c.title,rs:[dr?(dr.miss.length?'belge eksik: '+dr.miss.slice(0,2).join(', '):'belge gönderime hazır'):'',c.note||''].filter(Boolean),date:c.due,n,tab:'checklist'});
    }
    {const n0=daysUntil(o.startDate),end0=daysUntil(o.endDate||o.startDate);if(partOf(o)==='katiliyor'&&n0!==null&&n0<=45&&(end0===null||end0>=0)&&!trEnts(o).length)out.push({lvl:n0<=14?1:2,org:o,orgId:o.id,title:isBys(o)?'Seyahat eden kişi seçilmedi':n0<=0?'Yarışma sürüyor ama kafile listesi boş':'Kafile listesi boş',rs:isBys(o)?['Seyahat edenler girilmeden pasaport, vize, bilet ve harcırah kontrolleri yapılamıyor','“Seyahat edenler” sekmesinden kişiyi havuzdan ekle']:['Operasyondaki organizasyonda kafile girilmediği için uçuş, oda, belge ve bordro kontrolleri yapılamıyor','Kafile sekmesinden kişileri ekle ya da önceki organizasyondan aktar'],date:o.startDate,n:n0,tab:'kafile'})}
    gapIssues(o,out);extraIssues(o,out);
    if(o.endDate&&daysUntil(o.endDate)>=0){
      const lim=addMonths(o.endDate,6);
      const bad=st.pairs.map(([e,p])=>[e,travelView(p)]).filter(([e,p])=>p&&isDate(p.passportExpiry)&&p.passportExpiry<lim);

      const un=dp.filter(([e,p])=>!p.travelPass);
      if(un.length)out.push({lvl:n0!==null&&n0<=30?1:2,org:o,orgId:o.id,title:'Çift pasaport: seyahat pasaportu seçilmedi',rs:[un.map(([e,p])=>`${fullName(p)} (T.C. + ${p.pass2Country||'yabancı'})`).join(', '),'Bilet, akreditasyon ve vize hangi pasaportla yapılacaksa o pasaporttaki ad ve numarayla yapılmalı; kişi kaydında “Seyahatte kullanacağı pasaport”u seç'],date:o.startDate,n:n0,tab:'kafile'});
      const yb=dp.filter(([e,p])=>p.travelPass==='yabanci');
      if(yb.length)out.push({lvl:2,org:o,orgId:o.id,title:'Yabancı pasaportla seyahat: bilet adını kontrol et',rs:[yb.map(([e,p])=>{const v=travelView(p);return `${fullName(p)} → ${v.nationality||'yabancı'} pasaportu: ${upSur(v)} ${v.givenName}`}).join(' · '),'Biletteki ad ve pasaport no bu pasaporttakiyle birebir aynı olmalı; listeler bu pasaportla hazırlanır'],date:o.startDate,n:n0,tab:'kafile'});
    }
    for(const p of st.unpaid){if(!p.due)continue;const n=daysUntil(p.due);const lvl=n<0?0:n<=3?1:n<=10?2:null;if(lvl===null)continue;
      out.push({lvl,org:o,orgId:o.id,title:'Ödeme: '+p.item,rs:[money(p)],date:p.due,n,tab:'finans'})}
    for(const p of S.payments.filter(p=>p.orgId===o.id&&p.needsRevision&&p.status!=='iptal')){const r=p.needsRevision;out.push({lvl:1,org:o,orgId:o.id,title:'Revize fatura iste: '+p.item,rs:[`kafile ${r.from}→${r.to} kişi`,`faturadaki tutar hâlâ ${money(p)}`],date:todayStr(),n:0,tab:'finans'})}
  }
  for(const t of S.tasks){
    if(t.status==='tamamlandi'||!t.due)continue;
    if(tLinks(t).some(id=>{const c=S.checklist.find(x=>x.id===id);return c&&!c.done&&c.due===t.due}))continue;
    if(onlyOrg&&t.orgId!==onlyOrg)continue;
    const o=orgById(t.orgId);if(!onlyOrg&&(o?(!isLive(o)||!orgVisible(o)):fBranch!=='hepsi'))continue;
    const n=daysUntil(t.due);const lvl=n<0?0:n===0?1:n<=2?2:null;if(lvl===null)continue;
    out.push({lvl,org:o,orgId:o&&o.id,title:'Görev: '+t.title,rs:[optL(TASK_ST,t.status)],date:t.due,n,tab:'gorev',h:'gorevler'});
  }
  for(const m of S.mails){
    if(!m.needsReply||m.replied)continue;
    if(onlyOrg&&m.orgId!==onlyOrg)continue;
    if(!onlyOrg&&!visId(m.orgId))continue;
    const age=-(daysUntil(m.receivedAt)||0);
    out.push({lvl:age>=3?1:2,org:orgById(m.orgId),orgId:m.orgId,title:'Yanıt bekliyor: '+(m.subject||'(konusuz)'),rs:[m.from,age>0?`${age} gündür bekliyor`:''].filter(Boolean),date:m.receivedAt,n:null,tab:'yazisma'});
  }
  for(const i of out){if(i.org&&acroSoft(i.org)&&i.lvl<2){i.lvl=2;if(!i.rs.includes(ACRO_NOTE))i.rs.push(ACRO_NOTE)}}
  return out.sort((a,b)=>a.lvl-b.lvl||((a.n??999)-(b.n??999)));
}

/* ---------- Tarama durumu ---------- */
function scanDoc(id){return S.system.find(x=>x.id===id)}
function scanWarn(){
  if(!loaded.has('system'))return '';
  const out=[];const T=todayStr();const nowD=new Date();const mins=nowD.getHours()*60+nowD.getMinutes();
  const ld=iso=>{const d=new Date(iso);return isNaN(d)?'':`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
  const lt=iso=>{const d=new Date(iso);return isNaN(d)?'':`${pad(d.getHours())}:${pad(d.getMinutes())}`};
  const m=scanDoc('mailscan');
  const need=gymopsNs?'Tarama her gün 09:00’da işçi bilgisayarında yapılır; bilgisayar açık ve internete bağlı, GYMOPS Chrome profilinde Yahoo ve TCF oturumu açık olmalı.':'Tarama her gün 09:00’da bilgisayarında yapılır; o saatte bilgisayarın açık, Chrome çalışır, Yahoo ve TCF postasında oturum açık olmalı.';
  if(m&&m.tcfError&&(!m.tcfOk||m.tcfError&&ld(m.lastRunAt)===T))out.push('TCF postası taranamadı: '+esc(m.tcfError));
  if(!m||!m.lastOk){out.push('E-posta taraması henüz hiç çalışmadı. '+need)}
  else if(ld(m.lastOk)<T&&mins>=630){out.push(`<b>Bugün e-posta taranamadı.</b> Son başarılı tarama: ${fmtD(ld(m.lastOk))} ${lt(m.lastOk)}.${m.lastError?' Sebep: '+esc(m.lastError)+'.':''} ${need} Bu arada gelen kutusunu kendin kontrol et.`)}
  else if(m.lastError&&m.lastRunAt&&m.lastRunAt>m.lastOk){out.push(`<b>Son e-posta taraması yapılamadı</b> (${lt(m.lastRunAt)}). Sebep: ${esc(m.lastError)}. Son başarılı tarama ${lt(m.lastOk)}; sonrasında gelenleri kendin kontrol et.`)}
  const f=scanDoc('figscan');
  if(f&&f.lastOk&&daysUntil(ld(f.lastOk))<-8)out.push(`FIG/EG takvim taraması ${-daysUntil(ld(f.lastOk))} gündür yapılamadı.${f.lastError?' Sebep: '+esc(f.lastError):''} Haftada bir (10:00 sonrası) işçi bilgisayarında kendiliğinden yapılır. ${gymopsNs?'<button class="btn sm" data-act="figscan"'+(scanBusy?' disabled':'')+'>Şimdi tara</button>':''}`);
  const isc=scanDoc('isci');
  // Birden çok işçi bilgisayarı (Mac, Windows…): her biri ayrı satır; herhangi biri çevrimiçiyse iş yürür
  const mk=S.system.filter(x=>/^isci-/.test(x.id)&&x.lastSeen).sort((a,b)=>(a.ad||a.id).localeCompare(b.ad||b.id));
  const onl=x=>Date.now()-Date.parse(x.lastSeen)<180000;const mTxt=x=>`${esc(x.ad||x.id.slice(5))}${x.os?' ('+esc(x.os)+')':''}: ${onl(x)?'çevrimiçi'+(x.chrome?' · Chrome açık':''):`çevrimdışı (son görülme ${ld(x.lastSeen)===T?'bugün':fmtS(ld(x.lastSeen))} ${lt(x.lastSeen)})`}`;
  const macTxt=mk.length?mk.map(mTxt).join(' · ')+(mk.some(onl)?'':' — yapay zekâ yanıtları ve tarama bir işçi bilgisayarı açılınca yapılır')
    :isc&&isc.lastSeen?(Date.now()-Date.parse(isc.lastSeen)<120000?'İşçi bilgisayarı: çevrimiçi':`İşçi bilgisayarı: çevrimdışı (son görülme ${ld(isc.lastSeen)===T?'bugün':fmtS(ld(isc.lastSeen))} ${lt(isc.lastSeen)}) — yapay zekâ yanıtları ve tarama işçi bilgisayarı açılınca yapılır`):'';
  const info=[];if(macTxt)info.push(macTxt);if(m&&m.lastOk&&ld(m.lastOk)===T)info.push(`Son e-posta taraması: bugün ${lt(m.lastOk)}`);if(f&&f.lastOk)info.push(`FIG/EG takvimi: ${fmtS(ld(f.lastOk))}`);
  const man=m&&m.manualAt&&ld(m.manualAt)===T&&(!m.lastRunAt||m.lastRunAt<m.manualAt)?`<span>⏳ ${lt(m.manualAt)}’de tarama istendi.</span>`:'';
  const last=m&&m.lastOk?`Son e-posta taraması: <b>${ld(m.lastOk)===T?'bugün':fmtS(ld(m.lastOk))} ${lt(m.lastOk)}</b>`:'E-posta taraması henüz yapılmadı';
  const ask=scanAsk?`<span class="small">Tarama bilgisayarındaki Chrome’da Yahoo ve TCF postasını okur (göndermez, silmez, okundu durumunu değiştirmez). Bilgisayar açık ve iki posta oturumu açık olmalı.</span><button class="btn primary sm" data-act="scannow">Evet, şimdi tara</button><button class="btn ghost sm" data-act="scancancel">Vazgeç</button>`:'';
  const btn=`<div class="row" style="margin:${out.length?'-6px':'0'} 0 12px;gap:8px;flex-wrap:wrap;align-items:center"><span class="small">${last}</span>${scanAsk?ask:`<button class="btn${out.length?' primary':''} sm" data-act="scannow"${scanBusy?' disabled':''}>${scanBusy?'Başlatılıyor…':'📬 E-postaları şimdi tara'}</button>${gymopsNs&&!scanBusy?'<button class="btn ghost sm" data-act="scanreview">Tüm e-postaları gözden geçir</button>':''}`}${scanMsg?`<span class="small">${scanMsg}</span>`:man?`<span class="muted small">${man}</span>`:''}${info.length?`<span class="muted small">${info.filter(x=>!/^Son e-posta/.test(x)).join(' · ')}</span>`:''}</div>`;
  return (out.length?`<div class="banner" style="display:block">${out.join('<br>')}</div>`:'')+btn;
}
async function scanReq(kind,ok,mod){
  scanAsk=false;
  if(!gymopsNs){scanMsg='E-postaları hemen taratmak için Claude masaüstü uygulamasında <b>Scheduled</b> → “GYMOPS sabah e-posta taraması” → <b>Run now</b>. Tarama bitince “Son e-posta taraması” saati burada kendiliğinden güncellenir.';scheduleRender();return}
  scanBusy=true;scheduleRender();
  try{await gymopsNs.tara(kind,mod);const isc=scanDoc('isci');const on=isc&&isc.lastSeen&&Date.now()-Date.parse(isc.lastSeen)<120000;
    scanMsg=ok+(on?' işçi bilgisayarındaki işçi birkaç dakika içinde başlatır; bitince saat burada güncellenir.':' İşçi bilgisayarı şu an çevrimdışı; açılınca yapılır.');logIt(mod==='takvim'?'FIG/EG takvim taraması istendi':kind==='tarama'?'E-posta taraması istendi':'Tüm e-postaları gözden geçirme istendi')}
  catch(e){scanMsg='İstek gönderilemedi: '+dbErr(e)}
  scanBusy=false;scheduleRender();
}
function scanNow(){return scanReq('tarama','Tarama isteği gönderildi.')}
function scanTakvim(){return scanReq('tarama','FIG/EG takvim taraması istendi (10–20 dakika sürebilir).','takvim')}
function scanReview(){return scanReq('gozden_gecir','Gözden geçirme isteği gönderildi (son 30 gün; birkaç dakika sürer).')}

async function readPdf(file){
  if(!window.pdfjsLib)throw{message:'PDF okuyucu yüklenemedi; metni yapıştır.'};
  const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf,isEvalSupported:false}).promise;let t='';
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();let last=null;t+=`\n--- page ${i} ---\n`;c.items.forEach(it=>{if(last!==null&&Math.abs(it.transform[5]-last)>2)t+='\n';else if(last!==null)t+=' ';t+=it.str;last=it.transform[5]})}
  return t;
}

function vTakvim(){
  const items=[];
  S.deadlines.forEach(d=>{if(!visId(d.orgId)||!isDate(d.date))return;const o=orgById(d.orgId);if(d.status==='iptal')return;if(!o||partOf(o)==='katilmiyor')return;if(partOf(o)==='karar_yok'&&!REG.includes(d.kind))return;if(!isLive(o)&&d.status==='bekliyor')return;items.push({date:d.date,t:dlLabel(d),o,kind:'dl',d})});
  S.orgs.filter(o=>orgVisible(o)&&partOf(o)!=='katilmiyor').forEach(o=>{if(isDate(o.startDate)&&o.status!=='iptal')items.push({date:o.startDate,t:'Yarışma: '+fmtRange(o.startDate,o.endDate),o,kind:'ev'})});
  S.payments.forEach(p=>{if(!visId(p.orgId)||!payRel(p)||!isDate(p.due)||['odendi','iptal'].includes(p.status))return;items.push({date:p.due,t:'Ödeme: '+p.item+' · '+money(p),o:orgById(p.orgId),kind:'pay',open:true})});
  S.checklist.forEach(c=>{const o=orgById(c.orgId);if(c.done||!isDate(c.due)||!o||!visId(c.orgId)||!isLive(o)||partOf(o)!=='katiliyor'||clLinkedTasks(c.id).length)return;items.push({date:c.due,t:'Checklist: '+c.title,o,kind:'cl',open:true})});
  S.tasks.forEach(t=>{if(t.status==='tamamlandi'||!isDate(t.due)||!visId(t.orgId))return;items.push({date:t.due,t:'Görev: '+t.title,o:orgById(t.orgId),kind:'task',id:t.id,open:true})});
  let f=items;const lim={'7':7,'30':30,'90':90}[fCal];
  if(lim)f=f.filter(i=>{const n=daysUntil(i.date);return n>=0&&n<=lim||(i.kind==='dl'&&i.d.status==='bekliyor'&&n<0)||(i.open&&n<0)});
  else if(fCal==='gelecek')f=f.filter(i=>daysUntil(i.date)>=0||(i.kind==='dl'&&i.d.status==='bekliyor')||i.open);
  f.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  let h=`<div class="head"><div><h1>Takvim</h1><p>Son tarihler, checklist maddeleri, görevler, yarışmalar ve ödemeler tek akışta. Takipteki yarışmalarda yalnızca provisional ve definitive görünür; katılmadıkların hiç görünmez.</p></div><button class="btn" data-act="dlics"${downloads?'':' disabled'} title="Açık son tarihleri, checklist maddelerini ve yarışmaları telefon ya da bilgisayar takvimine aktarır">Takvim dosyası indir (.ics)</button></div><div class="row">${branchChips()}<span class="sp"></span><select data-chg="cal" aria-label="Aralık" style="width:auto">${[['7','7 gün'],['30','30 gün'],['90','90 gün'],['gelecek','Tüm gelecek'],['hepsi','Geçmiş dahil hepsi']].map(([k,l])=>`<option value="${k}"${fCal===k?' selected':''}>${l}</option>`).join('')}</select></div>`;
  if(!f.length)return h+'<div class="empty" style="margin-top:14px">Bu aralıkta kayıt yok.</div>';
  let cur='';h+='<div class="card" style="margin-top:14px">';
  f.forEach(i=>{const d=parseD(i.date);const mk=`${AY[d.getMonth()]} ${d.getFullYear()}`;if(mk!==cur){h+=`<div class="month">${mk}</div>`;cur=mk}
    const n=daysUntil(i.date);const done=i.kind==='dl'&&i.d.status==='tamamlandi';
    const l=i.kind==='ev'?'l3':done?'':n<0?'l0':n<=3?'l1':n<=10?'l2':'l3';
    h+=`<button class="issue ${l}" ${i.kind==='task'?`data-act="edittask" data-id="${esc(i.id)}"`:`data-act="openorg" data-id="${i.o?esc(i.o.id):''}" data-tab="${i.kind==='pay'?'finans':i.kind==='dl'?'sontarih':i.kind==='cl'?'checklist':'ozet'}"`}><span class="str"></span><span class="t">${esc(i.t)} ${done?pill('tamamlandı','p-ok'):''}${i.kind==='dl'&&i.d.sourceType==='dogrulanmamis'?pill('doğrulanmamış','p-dash'):''}</span><span class="d"><span class="mono">${fmtS(i.date)}</span><br>${done||i.kind==='ev'?'':`<b>${rel(n)}</b>`}</span><span class="r">${i.o?btag(i.o.branch)+' '+esc(i.o.name):''}</span></button>`});
  return h+'</div>';
}

function orgOpts(sel,blank){return (blank?`<option value="">${blank}</option>`:'')+S.orgs.slice().sort((a,b)=>(b.startDate||'')<(a.startDate||'')?-1:1).map(o=>`<option value="${o.id}"${sel===o.id?' selected':''}>${esc(o.name)}</option>`).join('')}
function candDl(c,orgId,body){
  const flags=[];let ok=true,def=true;
  if(!isDate(c.date)){flags.push(pill('tarih okunamadı','p-crit'));ok=false}
  const qok=c.quote&&norm(c.quote).length>=4&&norm(body).includes(norm(c.quote));
  if(!qok){flags.push(pill('alıntı e-postada bulunamadı','p-crit'));def=false}
  if(c.year_inferred){flags.push(pill('yıl yazılmamış, tahmin','p-dash'));def=false}
  if(c.derived){flags.push(pill('hesaplanmış tarih','p-dash'))}
  const {ex,amb}=orgId?findDl(orgId,c.kind,c.label):{ex:null,amb:false};
  if(ex&&ex.date===c.date){flags.push(pill('zaten kayıtlı','p-mute'));def=false}
  else if(ex){flags.push(pill(`DEĞİŞİKLİK: ${dlLabel(ex)} ${fmtS(ex.date)} → ${fmtS(c.date)}`,'p-warn'))}
  else if(amb){flags.push(pill('aynı türde birden çok kayıt var — hangisi olduğunu kontrol et','p-crit'));def=false}
  else flags.push(pill('yeni','p-info'));
  return {flags,ok,def,ex};
}
function initSel(){const M=ai.mail,R=M.result;if(!R)return;M.sel={};
  (R.deadlines||[]).forEach((c,i)=>{const r=candDl(c,M.resOrg,M.body);M.sel['d'+i]=r.ok&&r.def});
  (R.tasks||[]).forEach((c,i)=>{M.sel['t'+i]=true});

function tcOk(t){
  if(t===LOCKV)return true;
  if(!/^[1-9]\d{10}$/.test(String(t||'')))return false;

function mrzNames(s){const parts=String(s||'').replace(/<+$/,'').split('<<');return {surname:(parts[0]||'').replace(/</g,' ').trim(),given:parts.slice(1).join(' ').replace(/</g,' ').trim()}}
function parseMrz(lines){

  if(L.length>=3&&/^[ACI]/.test(L[0])){
    R.type='TD1';
    const a=L[0].match(/^[ACI][A-Z<][A-Z<]{3}([A-Z0-9<]{9})([0-9<])(.*)$/),b=L[1].match(/^(\d{6})(\d)([MFX<])(\d{6})(\d)([A-Z<]{3})(.*)$/);

    R.dob=mrzDate(b[1],1);R.ck.dob=mrzCd(b[1])===b[2]&&!!R.dob;R.sex=sex(b[3]);
    R.exp=mrzDate(b[4]);R.ck.exp=mrzCd(b[4])===b[5]&&!!R.exp;R.nat=b[6].replace(/</g,'');
    if(L[0].length===30&&L[1].length===30)R.ck.comp=mrzCd(L[0].slice(5,30)+L[1].slice(0,7)+L[1].slice(8,15)+L[1].slice(18,29))===L[1][29];
    Object.assign(R,mrzNames(L[2]));

    R.type=L[0][0]==='P'?'TD3':'TD2';
    const b=L[1].match(/^([A-Z0-9<]{9})([0-9<])([A-Z<]{3})(\d{6})(\d)([MFX<])(\d{6})(\d)(.*)$/);
    if(!b)return null;
    R.docNo=b[1].replace(/</g,'');R.ck.doc=mrzCd(b[1])===b[2];R.nat=b[3].replace(/</g,'');
    R.dob=mrzDate(b[4],1);R.ck.dob=mrzCd(b[4])===b[5]&&!!R.dob;R.sex=sex(b[6]);
    R.exp=mrzDate(b[7]);R.ck.exp=mrzCd(b[7])===b[8]&&!!R.exp;

function idMatch(it){

    const nm=S.people.filter(x=>[[x.surname,x.givenName],[x.pass2Surname,x.pass2Given]].some(([s,g])=>s&&g&&foldTr(s)===foldTr(f.surname)&&foldTr(g)===foldTr(f.givenName)));
    if(nm.length===1){it.how='ad';return nm[0].id}
    // ad farklı yazılmış olabilir: doğum tarihi aynı ve ad ya da soyaddan biri tutan tek kişi
    const w=s=>foldTr(s).split(' ').filter(x=>x.length>1);

function idCard(){
  if(!idS.open)return '';
  const its=idS.items,wait=its.filter(i=>i.status==='bekliyor').length,rd=its.filter(i=>i.status==='hazir').length,done=its.filter(i=>i.status==='kaydedildi').length;
  let h=`<section class="card" id="idcard" style="margin-bottom:16px;border-color:var(--primary)"><header><h2>Kimlik / pasaport yükle</h2><button class="btn sm ghost" data-act="idclose">Kapat</button></header><p class="muted small" style="margin-top:0">T.C. kimlik kartının (ön ve arka yüz ayrı dosya olabilir) ya da pasaport bilgi sayfasının fotoğrafını veya taramasını seç; birden fazla dosya seçebilirsin. GYMOPS kimlik no, doğum tarihi ve diğer alanları okur, kontrol haneleriyle sınar. Dosyaları seçer ya da buraya sürüklersen hepsi aynı anda okunur; sorunsuz okunanlar (kontrol haneleri tutan, uyuşmazlığı olmayan, kişisi net eşleşen, dolu bir alanı değiştirmeyen) doğrudan havuza eklenir. Yalnız okunamayan ya da sorunlu bulunanlar senin onayını bekler.</p>`;
  if(readOnly)h+='<p class="merr">Bu görünümde kayıt yapılamıyor.</p>';
  else if(!sample||idS.lim===null)h+='<p class="merr">Bu görünümde asistana görüntü gönderilemiyor. Sayfayı yenileyip tekrar dene; olmazsa kişileri “+ Kişi” ile elle ekleyebilirsin.</p>';
  else if(idS.lim===undefined)h+='<p class="muted small">Görüntü okuma özelliği kontrol ediliyor…</p>';
  else h+=`<div class="row" style="align-items:flex-end"><label class="fld" for="idfiles" style="flex:1;min-width:220px"><span>Belge görüntüleri (JPG, PNG, PDF)</span><input type="file" id="idfiles" multiple accept="image/*,application/pdf,.pdf"${idS.busy?' disabled':''}></label>${idS.busy?`<button class="btn" data-act="idstop">Durdur</button>`:`<button class="btn primary" data-act="idrun"${wait?'':' disabled'}>${wait?`${wait} belgeyi oku`:'Belgeleri oku'}</button>`}${its.length&&!idS.busy?'<button class="btn ghost" data-act="idclear">Listeyi temizle</button>':''}</div>`;
  if(idS.err)h+=`<p class="merr">${esc(idS.err)}</p>`;
  const nr=its.filter(idReady).length;
  if(its.length)h+=`<p class="small muted" style="margin:10px 0 0">${its.length} belge · ${wait} sırada · ${rd} onay bekliyor · ${done} havuza eklendi</p>${nr>1&&!idS.busy?`<div class="row" style="margin-top:8px"><button class="btn primary" data-act="idsaveall">Sorunsuz ${nr} belgeyi topluca işle</button><span class="small muted">Kontrol haneleri tutan, uyuşmazlığı olmayan ve kişisi net eşleşen belgeler; diğerleri tek tek onay bekler.</span></div>`:''}<div class="idlist">${its.map(idItem).join('')}</div>`;
  return h+`<p class="note" style="margin-top:12px">Gizlilik: Belge görüntüsü yalnızca okunmak için işçi bilgisayarındaki yapay zekâ bağlantısı (OmniRoute: GPT, Gemini ya da Claude) üzerinden gönderilir; GYMOPS görüntüyü saklamaz, sayfa kapanınca silinir. Veritabanına yalnızca sorunsuz okunan ya da onayladığın alanlar yazılır, kimlik bilgileri şifreli. Kimlik belgesi kişisel veridir: kurumunun KVKK ve yapay zekâ kullanımı kurallarına göre bu işleme iznin olduğundan emin ol.</p></section>`;
}

    if(op.op==='param'){const k=op.key;
      if(k==='kur'){const x=num(op.value,0.0001,100000,'kur',i);if(x!==null)nb.kur=x}
      else if(k==='damga'){const x=num(op.value,0,100,'damga vergisi oranı',i);if(x!==null)nb.damga=x}

        else if(k==='sheet'){if(v==='idari'||v==='diger')r.sheet=v;else E(i,'sayfa “idari” ya da “diger” olmalı')}

        else if(k==='net'){if(v===null||v===''||v==='auto')r.net=null;else{const x=num(v,0,1e7,'ele geçen tutar',i);if(x!==null)r.net=x}}
        else E(i,`bilinmeyen alan (${String(k).slice(0,20)})`)}});

const RD_PROMPT=`You read travel and payment documents for a sports federation's delegation trip and return structured data. The input is ONE document: an airline e-ticket / itinerary / PNR printout, a hotel booking confirmation, or a bank payment receipt (dekont / SWIFT).

function rdNorm(R){

function rdMatch(name,o){

    if(sur)return sq(sur)===sq(fs)&&(sq(giv)===sq(fg)||sq(fg).startsWith(sq(giv))||sq(giv).startsWith(sq(fg)))&&!!giv;

async function dlChecklist(o){

  ws.mergeCells('A1:E1');ws.getCell('A1').value=`${o.name.toLocaleUpperCase('tr-TR')} – OPERASYON CHECKLIST`;ws.getCell('A1').font={bold:true,size:13};
  ws.mergeCells('A2:E2');ws.getCell('A2').value=`${fmtRange(o.startDate,o.endDate)} | ${[o.city,o.country].filter(Boolean).join(', ')}${o.travelStart?` | Kafile: ${fmtS(o.travelStart)}–${fmtS(o.travelEnd)}`:''}`;
  const hr=['☐','Tarih','İşlem','Not / Kontrol','Kaynak'];hr.forEach((h,i)=>{const c=ws.getCell(4,i+1);c.value=h;c.font={bold:true};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE7EAF0'}};xlBorder(c)});
  clRows(o).forEach((r,i)=>{[r.done?'☑':'☐',fmtD(r.date),r.title,r.note||'',r.src].forEach((v,j)=>{const c=ws.getCell(5+i,j+1);c.value=v;c.alignment={wrapText:true,vertical:'top'};xlBorder(c)})});

let MF=null;
function openForm(cfg){
  MF=cfg;const data=cfg.data||{};
  const f=cfg.fields.map(fd=>{
    if(fd.sec)return `<div class="fsec">${esc(fd.sec)}</div>`;
    const v=data[fd.k]??fd.def??'';const id='f_'+fd.k;let inp;
    if(fd.t==='select')inp=`<select id="${id}" name="${fd.k}">${fd.o.map(([ov,ol])=>`<option value="${esc(ov)}"${String(ov)===String(v)?' selected':''}>${esc(ol)}</option>`).join('')}</select>`;
    else if(fd.t==='textarea')inp=`<textarea id="${id}" name="${fd.k}" rows="${fd.rows||3}">${esc(v)}</textarea>`;
    else if(fd.t==='check')inp=`<input type="checkbox" id="${id}" name="${fd.k}"${v?' checked':''}>`;
    else inp=`<input id="${id}" name="${fd.k}" type="${fd.t||'text'}" value="${esc(v)}"${fd.t==='number'?' step="any"':''}${fd.ph?` placeholder="${esc(fd.ph)}"`:''}>`;
    return `<label class="fld${fd.w==='full'?' full':''}${fd.t==='check'?' chk':''}" for="${id}">${fd.t==='check'?inp+`<span>${esc(fd.l)}</span>`:`<span>${esc(fd.l)}${fd.req?' *':''}</span>${inp}`}${fd.h?`<small>${esc(fd.h)}</small>`:''}</label>`;
  }).join('');
  const m=$('#modal');
  m.innerHTML=`<div class="mback" data-act="mclose"></div><form class="mbox" id="mform" novalidate role="dialog" aria-modal="true" aria-labelledby="mtitle"><header><h2 id="mtitle">${esc(cfg.title)}</h2><button type="button" class="x" data-act="mclose" aria-label="Kapat">×</button></header>${cfg.note?`<p class="mnote">${cfg.note}</p>`:''}<div class="fgrid">${f}</div><p class="merr" id="merr" role="alert"></p><footer>${cfg.onDelete?`<button type="button" class="btn danger ghost" id="mdel">Sil</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-act="mclose">Vazgeç</button><button type="submit" class="btn primary" id="msave">${esc(cfg.saveLabel||'Kaydet')}</button></footer></form>`;
  m.hidden=false;
  const form=$('#mform');const first=form.querySelector('input,select,textarea');if(first)first.focus();
  form.addEventListener('submit',async ev=>{ev.preventDefault();
    const vals={};cfg.fields.filter(x=>x.k).forEach(fd=>{const el=form.elements.namedItem(fd.k);vals[fd.k]=fd.t==='check'?el.checked:fd.t==='number'?(el.value===''?null:Number(el.value)):el.value.trim()});
    const miss=cfg.fields.filter(x=>x.req&&(vals[x.k]===''||vals[x.k]==null));
    if(miss.length){$('#merr').textContent='Zorunlu alan: '+miss.map(x=>x.l).join(', ');return}
    const bad=cfg.validate&&cfg.validate(vals);if(bad){$('#merr').textContent=bad;return}
    $('#msave').disabled=true;
    try{await cfg.onSave(vals);closeModal()}catch(e){$('#merr').textContent=dbErr(e);$('#msave').disabled=false}
  });
  const dbtn=$('#mdel');if(dbtn)dbtn.addEventListener('click',async()=>{
    if(!dbtn.dataset.arm){dbtn.dataset.arm='1';dbtn.textContent='Silmek için tekrar tıkla';return}
    dbtn.disabled=true;try{await cfg.onDelete();closeModal()}catch(e){$('#merr').textContent=dbErr(e);dbtn.disabled=false}
  });
}

function qkWhen(dt){const n=daysUntil(dt);if(n===null)return '';return `${fmtS(dt)} (${n<0?Math.abs(n)+' gün gecikti':n===0?'bugün':n+' gün kaldı'})`}
function qkPlan(days){

  const groups=[];
  for(const o of S.orgs){if(partOf(o)==='katilmiyor'||!isLive(o))continue;const it=[];
    S.deadlines.filter(d=>d.orgId===o.id&&d.status==='bekliyor'&&lim(d.date)&&(partOf(o)==='katiliyor'||['provisional','definitive'].includes(d.kind))).forEach(d=>it.push({d:d.date,t:dlLabel(d)+(d.sourceType==='dogrulanmamis'?' (doğrulanmamış tarih)':'')}));
    if(partOf(o)==='katiliyor'){
      S.checklist.filter(c=>c.orgId===o.id&&!c.done&&c.due&&lim(c.due)).forEach(c=>it.push({d:c.due,t:'Checklist: '+c.title}));
      S.payments.filter(x=>x.orgId===o.id&&['bekliyor','kismi'].includes(x.status)&&x.due&&lim(x.due)).forEach(x=>it.push({d:x.due,t:`Ödeme: ${x.item}${x.amount?` — ${trMoney(+x.amount)} ${x.currency||''}`:''}`}));}
    S.tasks.filter(t=>t.orgId===o.id&&t.status!=='tamamlandi'&&t.due&&lim(t.due)).forEach(t=>it.push({d:t.due,t:'Görev: '+t.title}));
    if(it.length){it.sort((a,b)=>a.d<b.d?-1:1);groups.push({o,it,first:it[0].d})}}
  groups.sort((a,b)=>a.first<b.first?-1:1);
  const gen=S.tasks.filter(t=>!t.orgId&&t.status!=='tamamlandi'&&(t.due?lim(t.due):t.priority==='yuksek'));
  const L=[];const n=groups.reduce((a,g)=>a+g.it.length,0)+gen.length;
  L.push(n?`Önümüzdeki ${days} günde (gecikenler dahil) ${n} iş var.`:`Önümüzdeki ${days} günde kayıtlı bir iş yok.`);
  groups.forEach(g=>{const o=g.o;L.push(`## ${o.name} — ${[o.city,o.country].filter(Boolean).join(', ')}, ${fmtRange(o.startDate,o.endDate)}${partOf(o)==='karar_yok'?' (takipte)':''}${acroSoft(o)?' (normal uyarı)':''}`);g.it.forEach(x=>L.push(`- ${qkWhen(x.d)} — ${x.t}`))});
  if(gen.length){L.push('## Günlük işler');gen.forEach(t=>L.push(`- ${t.due?qkWhen(t.due):'tarihsiz, öncelikli'} — ${t.title}`))}
  return L.join('\n');
}

const CMD_V=[['durum',/(NE KALDI|NELER KALDI|ACIK IS|ACIK ISLER|NE DURUMDA|DURUMU NE|NE YAPMAM LAZIM)/],['kesin',/\bKESIN(LESTIR\w*|LESTI\w*| YAP\w*| OLARAK)/],['aday',/\bADAY (YAP|OLARAK|A AL|E AL|E CEK|A CEK)/],

const CMD_TOPIC=[[/BILET|UCAK|UCUS/,['Uçak bileti']],[/GOREV AKRED/,['Görev akreditasyonu']],[/AKRED/,['Akreditasyon','Görev akreditasyonu']],[/KONAKLAMA|ROOMING|OTEL|\bODA/,['Konaklama']],[/VIZE|PASAPORT/,['Vize']],[/SIGORTA|ZEYIL/,['Sigorta']],[/\bOLUR|ONAY/,['Olur','Sigorta ve olur']],[/BORDRO|HARCIRAH/,['Bordro']],[/MUVAFAKAT/,['Muvafakat']],[/HAKEM BILDIR/,['Hakem']],[/YEDEK/,['Yedek']],[/DELEGATION|KAFILE LISTE|BILGI NOTU/,['Kafile listesi']],[/YARISMA KAYD|START LIST|MUZIK/,['Yarışma kaydı']],[/\bKAYIT|\bKAYD|NOMINATIVE|CEKILME/,['Kayıt','Kayıttan çıkar']]];
const cmdTok=q=>foldTr(q).split(' ').filter(Boolean);
function cmdPeople(q,pool){
  const T=cmdTok(q);const SUF=/^(Y?[IU]|N?[IU]N|Y?[EA]|[DT][EA]N?|Y?L[EA]|N[IU]|N[EA]|Y?[IU]M|S[IU]|[DT][EA]K[IU]|L[EA]R\w*)$/;const hit=(n)=>n.length>=2&&T.some(t=>t===n||(n.length>=3&&t.startsWith(n)&&SUF.test(t.slice(n.length))));

const cmdLiveOrgs=()=>S.orgs.filter(o=>partOf(o)==='katiliyor'&&isLive(o)&&!(daysUntil(o.endDate||o.startDate)<0));

}
function cmdOpen(oid,eid,pid){

  const t=e.target;
  if(t.dataset.bind){const [a,b]=t.dataset.bind.split('.');ai[a][b]=t.value}
  if(t.dataset.rssel!=null){rsS.sel[t.dataset.rssel]=t.checked;return}
  if(t.id==='askfile'){const fs=Array.from(t.files||[]);try{t.value=''}catch(x){}if(fs.length)askPickAll(fs);return}
  if(t.id==='rsfile'){const f=t.files&&t.files[0];try{t.value=''}catch(x){}if(f)rsRun(f);return}
  if(t.dataset.pgsablon){const f=t.files&&t.files[0];try{t.value=''}catch(x){}if(f)pgSablonYukle(t.dataset.pgsablon,f);return}
  if(t.dataset.rpk){const f=t.files&&t.files[0];try{t.value=''}catch(x){}if(f)rpKafileDoc(t.dataset.rpk,f);return}
  if(t.dataset.sel){ai.mail.sel[t.dataset.sel]=t.checked;return}
  if(t.dataset.dsel){dir.sel[t.dataset.dsel]=t.checked;return}
  if(t.id==='dfile'&&t.files&&t.files[0]){const f=t.files[0];dir.fileName=f.name;dir.err='';(f.type==='text/plain'?f.text():readPdf(f)).then(x=>{dir.text=x;dir.result=null;render()}).catch(e=>{dir.err='Dosya okunamadı: '+((e&&e.message)||'')+' Metni kopyalayıp yapıştırabilirsin.';render()});return}
  if(t.id==='bkfile'){const fs=Array.from(t.files||[]);const oid=t.dataset.org;try{t.value=''}catch(x){}if(fs.length)bkRun(fs,oid);return}
  if(t.id==='rdfile'){const f=t.files&&t.files[0];try{t.value=''}catch(x){}if(f)rdRun(f);return}
  if(t.id==='dkfile'){const f=t.files&&t.files[0];try{t.value=''}catch(x){}if(f)dkRun(f);return}
  if(t.dataset.dk){const k=t.dataset.dk;if(k==='org'){dk.orgId=t.value;dk.payId='';dk.auto=false}else if(k==='pay'){dk.payId=t.value;dk.auto=false}else{dk.res=dk.res||{};dk.res[k]=t.value}if(['org','pay','currency','amount'].includes(k))render();return}
  if(t.dataset.rdsel){rd.sel[t.dataset.rdsel]=t.checked;return}
  if(t.id==='xifile'){const f=t.files&&t.files[0];try{t.value=''}catch(x){}if(f)xiRun(f);return}
  if(t.dataset.xisel){xi.sel[t.dataset.xisel]=t.checked;return}
  if(t.dataset.xiow){xi.ow=t.checked;return}
  if(t.id==='bzchk'){const f=t.files&&t.files[0];try{t.value=''}catch(x){}if(f)bzCheck(orgById(curOrg),f);return}
  if(t.id==='bzfile'){const f=t.files&&t.files[0];try{t.value=''}catch(x){}if(f)bzImport(f);return}
  if(t.dataset.bzin)return;
  if(t.dataset.info||t.dataset.closetxt){pendingRender=false;render();return}
  if(t.dataset.lt){pendingRender=false;render();return}
  if(t.id==='idfiles'){idAdd(t.files);try{t.value=''}catch(x){}pendingRender=false;render();idRun();return}
  if(t.dataset.idf){idField(t,true);idRerender();return}
  if(t.dataset.idow){const [i,k]=t.dataset.idow.split(':');const it=idS.items.find(x=>x.id===i);if(it)it.ow[k]=t.checked;return}
  if(t.dataset.idack){const it=idS.items.find(x=>x.id===t.dataset.idack);if(it){it.ack=t.checked;pendingRender=false;render()}return}
  if(t.dataset.idt){const it=idS.items.find(x=>x.id===t.dataset.idt);if(it){it.target=t.value;it.tgtSet=true;it.ow={};t.blur();pendingRender=false;render()}return}
  if(t.dataset.idx){const [i,k]=t.dataset.idx.split(':');const it=idS.items.find(x=>x.id===i);if(it)it[k]=t.value;return}
  const c=t.dataset.chg;if(!c)return;
  if(c==='orgst')fOrgSt=t.value;else if(c==='cal')fCal=t.value;else if(c==='task')fTask=t.value;else if(c==='tscope')fScope=t.value;else if(c==='rpyear')rp.year=+t.value;else if(c==='pgay'){pg.ay=t.value;pg.msg='';pg.onceki=null}else if(c==='pghafta')pg.hafta=t.value;else if(c==='rpgsel'){if(rp.gm&&rp.gm[+t.dataset.j])rp.gm[+t.dataset.j].idx=+t.value;return}else if(c==='sgorg'){const g=S.sonucgelen.find(x=>x.id===t.dataset.id);if(g&&t.value){const x=Object.assign({},g,{orgId:t.value});delete x.id;put('sonucgelen',g.id,x,'Sonuç kitapçığı organizasyona bağlandı').catch(e=>toast(dbErr(e)))}return}else if(c==='dmove'){if(t.value&&ai.ask.dly){const id=ai.ask.dly.tid;ai.ask.dly=null;dMove(id,t.value).then(()=>{toast('Operasyona taşındı.');render()}).catch(e=>toast(dbErr(e)))}return}
  else if(c==='resorg'){ai.mail.resOrg=t.value;initSel()}
  else if(c==='draftorg'){ai.draft.orgId=t.value;ai.draft.mailId=''}
  else if(c==='dirtarget'){dir.target=t.value;if(dir.result){dir.sel={};dir.result.deadlines.forEach((x,i)=>{const r=candDl(x,dir.target,dir.text);dir.sel['d'+i]=r.ok&&r.def})}}
  else if(c==='dirpart')dir.part=t.value;
  t.blur();pendingRender=false;render();
});
function idField(t,final){
  const [i,k]=t.dataset.idf.split(':');const it=idS.items.find(x=>x.id===i);if(!it||!it.f)return;
  let v=t.value;
  if(final){v=k==='tcNo'?v.replace(/\D/g,''):k==='nationality'?v.toUpperCase().replace(/[^A-Z]/g,''):k==='passportNo'?v.toUpperCase().replace(/\s/g,''):v.trim().replace(/\s+/g,' ')}
  if(v!==it.f[k])delete it.from[k];
  it.f[k]=v;
}
function idRerender(){setTimeout(()=>{const a=document.activeElement;const key=a&&a.dataset?a.dataset.idf||'':'';pendingRender=false;render();if(key){const n=document.querySelector('[data-idf="'+key+'"]');if(n)n.focus()}},0)}
document.addEventListener('submit',e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==='bz'){bzSend();return}
  if(f==='dadd'){dAddForm();return}
  if(f==='pgkomut'){const q=String(pg.komut||'').trim();if(q)pgKomut(q);return}
  if(f==='ask')doAsk();else if(f==='analyze')doAnalyze();else if(f==='draft')doDraft();
});
init();
</script>
</body>
</html>
